<!DOCTYPE html>
<html>
<head>
<title>Lua Obfuscator (FINAL NO ERROR)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { background:#0b0b0b; color:white; text-align:center; font-family:Arial; }
textarea { width:95%; height:150px; margin:8px 0; background:#151515; color:#7CFFCB; border:none; padding:10px; border-radius:8px; }
button { padding:10px; margin:5px; background:#7CFFCB; border:none; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>

<h2>💀 Lua Obfuscator (NO ERROR)</h2>

<textarea id="input" placeholder="Masukkan script Lua..."></textarea>

<br>
<button onclick="obf()">🔒 Obfuscate</button>
<button onclick="dec()">🔓 Decode</button>

<textarea id="output"></textarea>

<script>
// encode ke byte
function encode(str){
    let res = "";
    for(let i=0;i<str.length;i++){
        res += "\\" + str.charCodeAt(i);
    }
    return res;
}

// decode
function decode(str){
    return str.replace(/\\(\d+)/g, (m,n)=>String.fromCharCode(n));
}

// OBF
function obf(){
    let code = input.value;
    if(!code) return alert("Isi script dulu!");

    let enc = encode(code);

    let lua = `
local s="${enc}"

local f = loadstring or load
f(s)()
`;

    output.value = lua;
}

// DECODE
function dec(){
    let code = input.value;

    try{
        let data = code.match(/local s="(.*?)"/)[1];
        output.value = decode(data);
    }catch{
        alert("Gagal decode!");
    }
}
</script>

</body>
</html>
