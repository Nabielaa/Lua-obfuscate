body { background:#0b0b0b; color:white; text-align:center; font-family:Arial; }
textarea { width:95%; height:150px; margin:8px 0; background:#151515; color:#7CFFCB; border:none; padding:10px; border-radius:8px; }
input { padding:10px; border:none; border-radius:8px; margin:5px; }

<body>

<h2>💀 Lua Obfuscator (FINAL SECURE)</h2>

<input id="password" placeholder="Password 🔑">
<textarea id="input" placeholder="Lua script..."></textarea>

<br>
<button onclick="obf()">🔒 Obfuscate</button>
<button onclick="dec()">🔓 Decode</button>

<textarea id="output"></textarea>

<script>
// BASE64
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}

// 🔒 ENCODE pakai PASSWORD
function encodeNum(str, pass){
    let arr=[];
    for(let i=0;i<str.length;i++){
        let key = pass.charCodeAt(i % pass.length);
        arr.push(str.charCodeAt(i) + key);
    }
    return arr.join(",");
}

// 🔓 DECODE pakai PASSWORD
function decodeNum(str, pass){
    let s="";
    let arr=str.split(",");
    for(let i=0;i<arr.length;i++){
        let key = pass.charCodeAt(i % pass.length);
        s+=String.fromCharCode(arr[i] - key);
    }
    return s;
}

// RANDOM
function rand(len){
    let c="abcdefghijklmnopqrstuvwxyz";
    let r="";
    for(let i=0;i<len;i++){
        r+=c[Math.floor(Math.random()*c.length)];
    }
    return r;
}

// JUNK
function noise(){
    let n="";
    for(let i=0;i<5;i++){
        n+=`local ${rand(5)}=${Math.random()*9999}\n`;
    }
    return n;
}

// 🔒 OBFUSCATE
function obf(){
    let code=input.value;
    let pass=password.value;

    if(!code||!pass){
        alert("Isi script & password!");
        return;
    }

    let b64 = b64e(code);
    let encoded = encodeNum(b64, pass);

    // sembunyikan password
    let passEnc = pass.split("").map(c=>c.charCodeAt(0)+2).reverse();

    let varData = rand(6);

    let lua = `
${noise()}
local _p={${passEnc}}

local function _dp(t)
    local s=""
    for i=#t,1,-1 do
        s=s..string.char(t[i]-2)
    end
    return s
end

local ${varData}="${encoded}"

local function decodeNum(str, pass)
    local s=""
    local i=0
    for v in string.gmatch(str,"[^,]+") do
        i=i+1
        local key = string.byte(pass, ((i-1)%#pass)+1)
        s=s..string.char(tonumber(v)-key)
    end
    return s
end

-- BASE64 DECODER
local b='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
local function b64decode(data)
    data = string.gsub(data, '[^'..b..'=]', '')
    return (data:gsub('.', function(x)
        if (x == '=') then return '' end
        local r,f='',(b:find(x)-1)
        for i=6,1,-1 do
            r=r..(f%2^i-f%2^(i-1)>0 and '1' or '0')
        end
        return r
    end):gsub('%d%d%d?%d?%d?%d?%d?%d?', function(x)
        if (#x ~= 8) then return '' end
        local c=0
        for i=1,8 do
            c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0)
        end
        return string.char(c)
    end))
end

local pass=_dp(_p)

local step1 = decodeNum(${varData}, pass)
local final = b64decode(step1)

local f = loadstring or load
f(final)()
`;

    output.value = lua;
}

// 🔓 DECODE WEB (BUTUH PASSWORD)
function dec(){
    let code=input.value;
    let pass=password.value;

    try{
        let data = code.match(/local \w+="(.*?)"/)[1];
        let step1 = decodeNum(data, pass);
        let original = b64d(step1);
        output.value = original;
    }catch{
        alert("Password salah / decode gagal!");
    }
}
</script>
