<!DOCTYPE html>
<html>
<head>
    <title>Lua Obfuscator - Devil Mode+</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background:#0b0b0b; color:white; text-align:center; font-family:Arial; }
        textarea { width:95%; height:150px; margin:8px 0; background:#151515; color:#7CFFCB; border:none; padding:10px; border-radius:8px; }
        input { padding:10px; border:none; border-radius:8px; margin:5px; }
        button { padding:10px; margin:5px; background:#7CFFCB; border:none; border-radius:8px; cursor:pointer; }
    </style>
</head>
<body>

<h2>💀 Lua Obfuscator (Devil Mode+)</h2>

<input id="password" placeholder="Password 🔑">
<textarea id="input" placeholder="Lua script..."></textarea>

<br>
<button onclick="obf()">Obfuscate</button>
<button onclick="dec()">Decode</button>

<textarea id="output"></textarea>

<script>
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}

function xor(s,k){
    let r="";
    for(let i=0;i<s.length;i++){
        r+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));
    }
    return r;
}

function rand(len){
    let c="abcdefghijklmnopqrstuvwxyz";
    let r="";
    for(let i=0;i<len;i++) r+=c[Math.floor(Math.random()*c.length)];
    return r;
}

function noise(){
    let n="";
    for(let i=0;i<6;i++){
        n+=`local ${rand(5)}=${Math.random()*9999}\n`;
    }
    return n;
}

// 🔒 encode password → angka + xor + reverse
function encodePass(pass){
    let key = 23;
    let arr = [];
    for(let i=0;i<pass.length;i++){
        arr.push(pass.charCodeAt(i) ^ key);
    }
    return arr.reverse();
}

// 🔓 decode password (buat fitur decode di web)
function decodePass(arr){
    let key = 23;
    let s="";
    arr = arr.slice().reverse();
    for(let i=0;i<arr.length;i++){
        s+=String.fromCharCode(arr[i]^key);
    }
    return s;
}

// OBFUSCATE
function obf(){
    let code=input.value;
    let pass=password.value;

    if(!code||!pass) return alert("isi semua");

    let encodedPass = encodePass(pass);

    let s1 = xor(code, pass);
    let s2 = b64e(s1);
    let s3 = xor(s2, pass.split("").reverse().join(""));
    let s4 = b64e(s3);

    let v1=rand(6), v2=rand(6), v3=rand(6);

    let lua = `
${noise()}
local _p=${JSON.stringify(encodedPass)}

local function _dp(t)
    local s=""
    for i=#t,1,-1 do
        s=s..string.char(bit32.bxor(t[i],23))
    end
    return s
end

local ${v1}=_dp(_p)
local ${v2}="${s4}"

local function ${v3}(a,b)
    local r=""
    for i=1,#a do
        r=r..string.char(bit32.bxor(string.byte(a,i), string.byte(b,((i-1)%#b)+1)))
    end
    return r
end

if not bit32 then error("Nope") end

local s = ${v3}((${v3}((${v3}(${v2},${v1})),string.reverse(${v1}))),${v1})

loadstring(s)()
`;

    output.value = lua;
}

// DECODE
function dec(){
    let code=input.value;
    let pass=password.value;

    try{
        let data = code.match(/local .*="(.*?)"/)[1];

        let s3 = b64d(data);
        let s2 = xor(s3, pass.split("").reverse().join(""));
        let s1 = b64d(s2);
        let original = xor(s1, pass);

        output.value = original;
    }catch{
        alert("decode gagal / password salah");
    }
}
</script>

</body>
</html>
