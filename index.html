<!DOCTYPE html>
<html>
<head>
<title>Lua Obfuscator (Simple & Work)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { background:#0b0b0b; color:white; text-align:center; font-family:Arial; }
textarea { width:95%; height:150px; margin:8px 0; background:#151515; color:#7CFFCB; border:none; padding:10px; border-radius:8px; }
button { padding:10px; margin:5px; background:#7CFFCB; border:none; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>

<h2>💀 Lua Obfuscator (Simple & Work)</h2>

<textarea id="input" placeholder="Masukkan script Lua..."></textarea>

<br>
<button onclick="obf()">🔒 Obfuscate</button>
<button onclick="dec()">🔓 Decode</button>

<textarea id="output" placeholder="Hasil..."></textarea>

<script>
// BASE64
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}

// 🔒 OBFUSCATE (simple & aman)
function obf(){
    let code=document.getElementById("input").value;
    if(!code) return alert("Isi script dulu!");

    let encoded = b64e(code);

    let lua = `
local data="${encoded}"

-- base64 decode
local b='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
local function b64decode(data)
    data = string.gsub(data, '[^'..b..'=]', '')
    return (data:gsub('.', function(x)
        if (x == '=') then return '' end
        local r,f='',(b:find(x)-1)
        for i=6,1,-1 do
            r=r..(f%2^i-f%2^(i-1)>0 and '1' or '0')
        end
        return r
    end):gsub('%d%d%d?%d?%d?%d?%d?%d?', function(x)
        if (#x ~= 8) then return '' end
        local c=0
        for i=1,8 do
            c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0)
        end
        return string.char(c)
    end))
end

local decoded = b64decode(data)

local f = loadstring or load
f(decoded)()
`;

    document.getElementById("output").value = lua;
}

// 🔓 DECODE WEB
function dec(){
    let code=document.getElementById("input").value;

    try{
        let data = code.match(/data="(.*?)"/)[1];
        let original = b64d(data);
        document.getElementById("output").value = original;
    }catch{
        alert("Gagal decode!");
    }
}
</script>

</body>
</html>
