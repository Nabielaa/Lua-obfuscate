<!DOCTYPE html>
<html>
<head>
<title>💀 Lua Obfuscator (Delta Safe)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    background:#0b0b0b;
    color:white;
    text-align:center;
    font-family:Arial;
}
textarea {
    width:95%;
    height:150px;
    margin:8px 0;
    background:#151515;
    color:#7CFFCB;
    border:none;
    padding:10px;
    border-radius:8px;
}
input {
    padding:10px;
    border:none;
    border-radius:8px;
    margin:5px;
    width:200px;
}
button {
    padding:10px;
    margin:5px;
    background:#7CFFCB;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
</style>
</head>
<body>

<h2>💀 Lua Obfuscator (FINAL)</h2>

<input id="password" placeholder="Password 🔑">
<br>

<textarea id="input" placeholder="Masukkan script Lua..."></textarea>

<br>
<button onclick="obf()">🔒 Obfuscate</button>
<button onclick="dec()">🔓 Decode</button>

<textarea id="output" placeholder="Hasil muncul di sini..."></textarea>

<script>
// BASE64
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}

// ENCODE ANGKA (AMAN)
function encodeNum(str){
    let arr=[];
    for(let i=0;i<str.length;i++){
        arr.push(str.charCodeAt(i)+5);
    }
    return arr.join(",");
}

// DECODE ANGKA
function decodeNum(str){
    let s="";
    let arr=str.split(",");
    for(let i=0;i<arr.length;i++){
        s+=String.fromCharCode(arr[i]-5);
    }
    return s;
}

// RANDOM STRING
function rand(len){
    let c="abcdefghijklmnopqrstuvwxyz";
    let r="";
    for(let i=0;i<len;i++){
        r+=c[Math.floor(Math.random()*c.length)];
    }
    return r;
}

// JUNK CODE
function noise(){
    let n="";
    for(let i=0;i<5;i++){
        n+=`local ${rand(5)}=${Math.random()*9999}\n`;
    }
    return n;
}

// 🔒 OBFUSCATE
function obf(){
    let code=document.getElementById("input").value;
    let pass=document.getElementById("password").value;

    if(!code||!pass){
        alert("Isi script & password dulu!");
        return;
    }

    // layer 1
    let s1 = b64e(code);

    // layer 2
    let s2 = encodeNum(s1);

    // password disembunyikan
    let p = pass.split("").map(c=>c.charCodeAt(0)+2).reverse();

    let v1=rand(6);

    let lua = `
${noise()}
local _p={${p}}

local function _dp(t)
    local s=""
    for i=#t,1,-1 do
        s=s..string.char(t[i]-2)
    end
    return s
end

local ${v1}="${s2}"

local function _dn(s)
    local r=""
    for v in string.gmatch(s,"[^,]+") do
        r=r..string.char(tonumber(v)-5)
    end
    return r
end

local pass=_dp(_p)

if not pass then return end

local decoded=_dn(${v1})

local final=(function(x)
    return (x:gsub('.', function(c)
        return string.char(string.byte(c))
    end))
end)(decoded)

local f = loadstring or load
f(final)()
`;

    document.getElementById("output").value = lua;
}

// 🔓 DECODE
function dec(){
    let code=document.getElementById("input").value;

    try{
        let data = code.match(/local \w+="(.*?)"/)[1];
        let step1 = decodeNum(data);
        let original = b64d(step1);
        document.getElementById("output").value = original;
    }catch{
        alert("Decode gagal!");
    }
}
</script>

</body>
</html>
