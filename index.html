<!DOCTYPE html>
<html>
<head>
    <title>Lua Obfuscator - Devil Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background:#0b0b0b; color:#eaeaea; font-family:Arial; text-align:center; }
        textarea { width:95%; height:150px; margin:8px 0; background:#151515; color:#7CFFCB; border:none; padding:10px; border-radius:8px; }
        input { padding:10px; border:none; border-radius:8px; margin:5px; }
        button { padding:10px 15px; margin:5px; background:#7CFFCB; border:none; border-radius:8px; cursor:pointer; }
    </style>
</head>
<body>

<h2>💀 Lua Obfuscator (Devil Mode Lite)</h2>

<input id="password" placeholder="Password 🔑">
<textarea id="input" placeholder="Lua script..."></textarea>

<br>
<button onclick="obf()">Obfuscate</button>
<button onclick="dec()">Decode</button>

<textarea id="output"></textarea>

<script>
// utils
function b64e(s){return btoa(unescape(encodeURIComponent(s)));}
function b64d(s){return decodeURIComponent(escape(atob(s)));}

function xor(s,k){
    let r="";
    for(let i=0;i<s.length;i++){
        r+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));
    }
    return r;
}

function rand(len){
    let c="abcdefghijklmnopqrstuvwxyz";
    let r="";
    for(let i=0;i<len;i++) r+=c[Math.floor(Math.random()*c.length)];
    return r;
}

// fake noise
function noise(){
    let n="";
    for(let i=0;i<8;i++){
        n+=`local ${rand(5)}=${Math.random()*9999}\n`;
    }
    return n;
}

// OBF
function obf(){
    let code=input.value;
    let pass=password.value;

    if(!code||!pass) return alert("isi semua");

    let s1 = xor(code, pass);
    let s2 = b64e(s1);
    let s3 = xor(s2, pass.split("").reverse().join(""));
    let s4 = b64e(s3);

    let var1=rand(6), var2=rand(6), var3=rand(6);

    let lua = `
${noise()}
local ${var1}="${pass}"
local ${var2}="${s4}"

local function ${var3}(a,b)
    local r=""
    for i=1,#a do
        r=r..string.char(bit32.bxor(string.byte(a,i), string.byte(b,((i-1)%#b)+1)))
    end
    return r
end

-- anti simple tamper
if not bit32 then error("Environment not supported") end

local s = ${var3}((${var3}((${var3}(${var2},${var1})),string.reverse(${var1}))),${var1})

loadstring((function()
    return (function(x)
        return (x:gsub('.', function(c)
            return string.char(string.byte(c))
        end))
    end)(s)
end)())()
`;

    output.value = lua;
}

// DECODE
function dec(){
    let code=input.value;
    let pass=password.value;

    try{
        let data = code.match(/local .*="(.*?)"/g)[1].match(/"(.*?)"/)[1];

        let s3 = b64d(data);
        let s2 = xor(s3, pass.split("").reverse().join(""));
        let s1 = b64d(s2);
        let original = xor(s1, pass);

        output.value = original;
    }catch{
        alert("decode gagal / password salah");
    }
}
</script>

</body>
</html>
